<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperatura IS Fortuny Succursale</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background-color: #0d1117; color: #c9d1d9; text-align: center; padding: 25px 40px; margin: 0; }
        h1 { font-weight: 300; margin-bottom: 10px; margin-top: 10px; }
        h2.istituto { margin-bottom: 5px; color: #8b949e; font-weight: 400; }
        
        .debug-bar { background: #161b22; border: 1px solid #30363d; display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; margin-bottom: 25px; color: #8b949e; }
        
        .dashboard { display: flex; justify-content: center; gap: 40px; margin-bottom: 25px; flex-wrap: wrap; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 25px; width: 240px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .card h2 { margin: 0 0 10px 0; font-size: 1.1rem; color: #8b949e; font-weight: 400; text-transform: uppercase; letter-spacing: 1px;}
        .value { font-size: 3.5rem; font-weight: bold; color: #58a6ff; text-shadow: 0 0 15px rgba(88, 166, 255, 0.3); }
        .unit { font-size: 1.5rem; color: #8b949e; font-weight: normal; margin-left: 5px;}
        .value.hum { color: #3fb950; text-shadow: 0 0 15px rgba(63, 185, 80, 0.3); }
        .minmax-container { display: flex; justify-content: space-around; margin-top: 15px; border-top: 1px solid #30363d; padding-top: 10px; font-size: 0.9rem; color: #8b949e; }
        .min-val { color: #58a6ff; font-weight: bold; }
        .max-val { color: #f85149; font-weight: bold; }
        
        .chart-container { background: #161b22; border: 1px solid #30363d; border-radius: 12px; max-width: 700px; margin: 0 auto 20px auto; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .controls { margin-bottom: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        
        .btn { background-color: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background-color: #30363d; border-color: #8b949e; }
        .btn.active { background-color: #1f6feb; border-color: #388bfd; color: #ffffff; }
        
        .log-container { background: #161b22; border: 1px solid #30363d; border-radius: 12px; max-width: 700px; margin: 20px auto; padding: 15px; text-align: left; box-shadow: 0 4px 20px rgba(0,0,0,0.5); display: none; }
        .log-container h3 { margin: 0 0 10px 0; font-size: 1rem; color: #8b949e; font-weight: 400; }
        .log-list { max-height: 120px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; color: #7d8590; padding: 8px; background: #0d1117; border-radius: 6px; border: 1px solid #30363d; }
        .log-entry { padding: 3px 0; border-bottom: 1px solid #21262d; }

        @keyframes beat { to { transform: scale(1.25); } }

        @media (max-width: 600px) {
            body { padding: 15px 10px; }
            .dashboard { gap: 20px; }
            .card { width: 100%; max-width: 320px; }
            .chart-container, .log-container { padding: 10px; }
            h1 { font-size: 1.5rem; }
            .value { font-size: 2.8rem; }
        }
    </style>
</head>
<body>
   
    <h2 class="istituto">Istituto M.Fortuny</h2>
    <h1>Temperatura Istituto Succursale</h1>
    
    <div class="debug-bar">
        Stato Database: <span id="debug-status" style="color: #ffa657; font-weight: bold;">In connessione...</span> | 
        Punti in Archivio: <span id="debug-count" style="color: #58a6ff; font-weight: bold;">0</span>
    </div>
    
    <div class="dashboard">
        <div class="card">
            <h2>Temperatura</h2>
            <div id="temp-val" class="value">--<span class="unit">°C</span></div>
            <div class="minmax-container">
                <div>Min: <span id="temp-min" class="min-val">--</span>°C</div>
                <div>Max: <span id="temp-max" class="max-val">--</span>°C</div>
            </div>
        </div>
        <div class="card">
            <h2>Umidità</h2>
            <div id="hum-val" class="value hum">--<span class="unit">%</span></div>
        </div>
    </div>

    <div class="chart-container">
        <div class="controls">
            <button id="btn-24h" class="btn active" onclick="cambiaVisualizzazione('24h')">24 Ore</button>
            <button id="btn-7d" class="btn" onclick="cambiaVisualizzazione('7d')">1 Settimana</button>
            <button id="btn-1m" class="btn" onclick="cambiaVisualizzazione('1m')">1 Mese</button>
            <button id="btn-log" class="btn" onclick="toggleLog()">Mostra Console Log</button>
        </div>
        <div style="position: relative; height: 280px; width: 100%;">
            <canvas id="historyChart"></canvas>
        </div>
    </div>
    
    <div id="log-panel" class="log-container">
        <h3>Console Log dei Dati (In tempo reale)</h3>
        <div id="log-list" class="log-list"></div>
    </div>
    
    <p style="color: #8b949e; font-size: 0.95rem; margin-top: 25px; letter-spacing: 0.5px;">
        Made with <span style="display: inline-block; animation: beat 0.4s infinite alternate; transform-origin: center;">❤️</span> by F. Marca, M. Brozzoni, 3°J
    </p>

    <script>
        const firebaseConfig = {
            databaseURL: "https://meteo-fortuny-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const tempVal = document.getElementById('temp-val');
        const humVal = document.getElementById('hum-val');
        const tempMinDoc = document.getElementById('temp-min');
        const tempMaxDoc = document.getElementById('temp-max');
        const logList = document.getElementById('log-list');
        const logPanel = document.getElementById('log-panel');
        const debugStatus = document.getElementById('debug-status');
        const debugCount = document.getElementById('debug-count');

        let masterLabels = [];
        let masterTemp = [];
        let masterHum = [];
        let minTemp = null;
        let maxTemp = null;
        let vistaCorrente = '24h'; 
        let listenerStorico = null;

        const ctx = document.getElementById('historyChart');
        const historyChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'Temperatura (°C)', data: [], borderColor: '#58a6ff', backgroundColor: 'rgba(88, 166, 255, 0.1)', borderWidth: 2, tension: 0.3, yAxisID: 'yTemp', pointRadius: 0, pointHitRadius: 10 },
                    { label: 'Umidità (%)', data: [], borderColor: '#3fb950', backgroundColor: 'rgba(63, 185, 80, 0.1)', borderWidth: 2, tension: 0.3, yAxisID: 'yHum', pointRadius: 0, pointHitRadius: 10 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { color: '#21262d' }, ticks: { color: '#8b949e', maxTicksLimit: 12 } },
                    yTemp: { type: 'linear', display: true, position: 'left', grid: { color: '#30363d' }, ticks: { color: '#8b949e' } },
                    yHum: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, ticks: { color: '#8b949e' } }
                },
                plugins: { legend: { labels: { color: '#c9d1d9' } } }
            }
        });

        function aggiornaGrafico() {
            // Calcola la media dei punti per alleggerire il grafico
            let chunkSize = 3; // 3 misure = media ogni 30s (per vista 24h)
            if (vistaCorrente === '7d') chunkSize = 15; // Raggruppamento ottimizzato per la settimana
            if (vistaCorrente === '1m') chunkSize = 60; // Raggruppamento ottimizzato per il mese

            let labelsTarget = [];
            let tempTarget = [];
            let humTarget = [];

            for (let i = 0; i < masterLabels.length; i += chunkSize) {
                let chunkTemp = masterTemp.slice(i, i + chunkSize);
                let chunkHum = masterHum.slice(i, i + chunkSize);

                let avgTemp = chunkTemp.reduce((a, b) => a + b, 0) / chunkTemp.length;
                let avgHum = chunkHum.reduce((a, b) => a + b, 0) / chunkHum.length;

                let labelIndex = Math.floor(chunkTemp.length / 2);
                let label = masterLabels[i + labelIndex];

                labelsTarget.push(label);
                tempTarget.push(parseFloat(avgTemp.toFixed(2)));
                humTarget.push(parseFloat(avgHum.toFixed(2)));
            }

            historyChart.data.labels = [...labelsTarget];
            historyChart.data.datasets[0].data = [...tempTarget];
            historyChart.data.datasets[1].data = [...humTarget];
            historyChart.update();
        }

        function caricaStorico(limitePunti) {
            if (listenerStorico) {
                database.ref('storico').off('value', listenerStorico);
            }

            listenerStorico = database.ref('storico').limitToLast(limitePunti).on('value', (snapshot) => {
                masterLabels = [];
                masterTemp = [];
                masterHum = [];
                
                if (snapshot.exists()) {
                    debugCount.innerText = snapshot.numChildren();
                    
                    snapshot.forEach((childSnapshot) => {
                        const punto = childSnapshot.val();
                        if (punto && punto.temperatura !== undefined) {
                            const etichettaX = (vistaCorrente !== '24h' && punto.data) ? `${punto.data} ${punto.ora}` : punto.ora;
                            
                            masterLabels.push(etichettaX);
                            masterTemp.push(parseFloat(punto.temperatura));
                            masterHum.push(parseFloat(punto.umidita));
                        }
                    });

                    if (masterTemp.length > 0) {
                        minTemp = Math.min(...masterTemp);
                        maxTemp = Math.max(...masterTemp);
                        tempMinDoc.innerText = minTemp.toFixed(1);
                        tempMaxDoc.innerText = maxTemp.toFixed(1);
                    }

                    const last = masterLabels.length - 1;
                    if(last >= 0) {
                        aggiungiRigaLog(masterLabels[last], masterTemp[last].toFixed(1), masterHum[last].toFixed(0), "ARCHIVIO");
                    }
                } else {
                    debugCount.innerText = "0 (Database Storico vuoto)";
                }
                aggiornaGrafico();
            });
        }

        function cambiaVisualizzazione(tipo) {
            vistaCorrente = tipo;
            document.getElementById('btn-24h').classList.toggle('active', tipo === '24h');
            document.getElementById('btn-7d').classList.toggle('active', tipo === '7d');
            document.getElementById('btn-1m').classList.toggle('active', tipo === '1m');

            let limite = 8640; // 24 ore (intervallo 10s)
            if (tipo === '7d') limite = 60480;   // 7 giorni
            if (tipo === '1m') limite = 259200;  // 30 giorni

            caricaStorico(limite);
        }

        function toggleLog() {
            if (logPanel.style.display === 'none' || logPanel.style.display === '') {
                logPanel.style.display = 'block';
                document.getElementById('btn-log').classList.add('active');
            } else {
                logPanel.style.display = 'none';
                document.getElementById('btn-log').classList.remove('active');
            }
        }

        function aggiungiRigaLog(ora, t, h, tipo) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span style="color: #58a6ff;">[${ora}]</span> <span style="color: #8b949e;">${tipo}:</span> T = <span style="color: #ffa657;">${t}°C</span> | U = <span style="color: #56e36e;">${h}%</span>`;
            logList.insertBefore(entry, logList.firstChild);
            if (logList.children.length > 50) logList.removeChild(logList.lastChild);
        }

        database.ref('corrente').on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                debugStatus.innerText = "ONLINE (Ricezione Live)";
                debugStatus.style.color = "#3fb950";
                
                const t = parseFloat(data.temperatura);
                const h = parseFloat(data.umidita);

                tempVal.innerHTML = t.toFixed(1) + '<span class="unit">°C</span>';
                humVal.innerHTML = h.toFixed(0) + '<span class="unit">%</span>';
                
                if(minTemp !== null && t < minTemp) { minTemp = t; tempMinDoc.innerText = minTemp.toFixed(1); }
                if(maxTemp !== null && t > maxTemp) { maxTemp = t; tempMaxDoc.innerText = maxTemp.toFixed(1); }
                
                aggiungiRigaLog(data.ora, t.toFixed(1), h.toFixed(0), "LIVE STREAM");
            } else {
                debugStatus.innerText = "Nessun dato in 'corrente'";
            }
        });

        // Caricamento iniziale default su 24h
        caricaStorico(8640);
    </script>
</body>
</html>
